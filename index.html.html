  topics:[
  {id:"math-fractions", emoji:"🍰", title:"Дроби", short:"Складываем, умножаем и делим дроби без страха",
    explain:"Дробь показывает часть целого. Например, 1/2 это половина пиццы. Главное правило сложения: знаменатели (нижние числа) должны быть одинаковыми. Если они разные, сначала приводим к общему.",
    rule:`<p>Сложение и вычитание: сначала общий знаменатель.</p><p>Умножение: верх на верх, низ на низ.</p><p>Деление: вторую дробь переверни и умножай.</p><div class="formula">a/b × c/d = (a·c)/(b·d)</div>`,
    examples:[{q:"1/2 + 1/3",steps:["Знаменатели разные: 2 и 3. Общий знаменатель 6.","1/2 = 3/6, а 1/3 = 2/6.","Складываем верхние числа: 3/6 + 2/6 = 5/6."]},{q:"2/3 : 4/9",steps:["Деление заменяем умножением: вторую дробь переворачиваем.","Получаем 2/3 × 9/4.","Сокращаем: 2 и 4 делим на 2, 3 и 9 делим на 3. Остаётся 1/1 × 3/2.","Ответ: 3/2 = 1,5."]},{q:"0,3 + 1/4",steps:["Переведём 1/4 в десятичную дробь: 1 : 4 = 0,25.","Складываем: 0,3 + 0,25 = 0,55."]}],
    practice:[{q:"3/4 − 1/6",a:"7/12 (общий знаменатель 12: 9/12 − 2/12)"},{q:"5/6 × 3/10",a:"1/4 (15/60 после сокращения)"},{q:"0,5 : 1/4",a:"2 (0,5 = 1/2, затем 1/2 × 4 = 2)"}],
    mistakes:["Складывают знаменатели: 1/2 + 1/3 это НЕ 2/5.","Забывают сократить дробь в конце.","При делении переворачивают первую дробь, а надо вторую."],
    hack:"Сначала сокращай крест-накрест, а потом умножай. Числа станут маленькими, и ошибиться труднее.",
    quiz:[{q:"1/2 + 1/4 = ?",o:["2/6","3/4","1/8","2/4"],a:1},{q:"2/5 × 5/6 = ?",o:["7/11","1/3","2/3","1/6"],a:1},{q:"1/2 : 1/4 = ?",o:["1/8","1/2","2","4"],a:2}]},
  {id:"math-percent", emoji:"🏷️", title:"Проценты", short:"Скидки, доли и «на сколько процентов»",
    explain:"Один процент это одна сотая часть. Значит, 50% это половина, 25% это четверть, 10% это одна десятая. Чтобы найти процент от числа, умножаем число на дробь: 15% = 0,15.",
    rule:`<div class="formula">p% от A = A · p / 100</div><p>Сколько процентов B составляет от A: делим B на A и умножаем на 100%.</p><p>Увеличить на p%: A · (1 + p/100). Уменьшить: A · (1 − p/100).</p>`,
    examples:[{q:"Найти 15% от 200",steps:["15% = 0,15.","200 · 0,15 = 30."]},{q:"Сколько процентов составляет 12 от 60?",steps:["Делим: 12 : 60 = 0,2.","Умножаем на 100%: 0,2 · 100% = 20%."]},{q:"Товар стоил 800 ₽ и подорожал на 10%",steps:["Новая цена = 100% + 10% = 110% от старой.","800 · 1,1 = 880 ₽."]}],
    practice:[{q:"25% от 80",a:"20"},{q:"Скидка 20% на товар за 500 ₽. Новая цена?",a:"400 ₽ (500 · 0,8)"},{q:"Сколько процентов составляет 9 от 36?",a:"25%"}],
    mistakes:["«На 10%» путают с «в 10 раз». Это совсем разное!","Если цена выросла на 10%, а потом упала на 10%, прежней она НЕ станет."],
    hack:"10% это делим на 10. 50% это делим на 2. 25% это делим на 4. Остальные собираем из них.",
    quiz:[{q:"10% от 350 это сколько?",o:["3,5","35","350","3500"],a:1},{q:"Сколько процентов составляет 20 от 50?",o:["20%","25%","40%","50%"],a:2},{q:"Куртка стоила 2000 ₽, скидка 15%. Новая цена?",o:["1700 ₽","1800 ₽","300 ₽","2300 ₽"],a:0}]},
  {id:"math-linear", emoji:"⚖️", title:"Линейные уравнения", short:"Уравнение это весы, и мы держим их ровно",
    explain:"Представь весы: что сделал с одной чашей, то сделай и с другой, и они останутся ровными. Наша цель: оставить x одного. Числа с x собираем слева, обычные числа справа.",
    rule:`<p>Переносим слагаемое через «=» и меняем его знак.</p><p>В конце делим обе части на число перед x.</p><div class="formula">ax + b = c → x = (c − b) / a</div>`,
    examples:[{q:"3x + 5 = 20",steps:["Переносим 5 вправо со знаком минус: 3x = 20 − 5.","3x = 15.","Делим на 3: x = 5."]},{q:"2(x − 4) = 10",steps:["Делим обе части на 2: x − 4 = 5.","Переносим 4: x = 5 + 4.","x = 9."]},{q:"5x − 7 = 2x + 11",steps:["Иксы влево, числа вправо: 5x − 2x = 11 + 7.","3x = 18.","x = 6."]}],
    practice:[{q:"4x − 9 = 15",a:"x = 6"},{q:"6x + 4 = 2x + 16",a:"x = 3 (4x = 12)"},{q:"3(x + 2) = 24",a:"x = 6 (x + 2 = 8)"}],
    mistakes:["Перенесли число, а знак не поменяли.","Раскрыли скобку только у первого слагаемого."],
    hack:"Проверка спасает: подставь ответ вместо x. Если обе части равны, всё верно.",
    quiz:[{q:"2x + 6 = 14. Чему равен x?",o:["3","4","5","10"],a:1},{q:"x : 3 = 5. Чему равен x?",o:["15","8","5/3","2"],a:0},{q:"5x − 2 = 3x + 8. Чему равен x?",o:["3","4","5","6"],a:2}]},
  {id:"math-quadratic", emoji:"🧩", title:"Квадратные уравнения", short:"Дискриминант: три шага и готово",
    explain:"Квадратное уравнение выглядит так: ax² + bx + c = 0. Чтобы его решить, считаем дискриминант D. Он подсказывает, сколько у уравнения корней.",
    rule:`<div class="formula">D = b² − 4ac</div><ul><li>D больше 0: два корня, x = (−b ± √D) / 2a</li><li>D равен 0: один корень, x = −b / 2a</li><li>D меньше 0: корней нет</li></ul>`,
    examples:[{q:"x² − 5x + 6 = 0",steps:["Выписываем: a = 1, b = −5, c = 6.","D = 25 − 24 = 1.","x = (5 ± 1) / 2.","Корни: 3 и 2."]},{q:"x² − 9 = 0 (неполное)",steps:["Переносим 9: x² = 9.","x = 3 или x = −3."]},{q:"x² − 4x = 0 (неполное)",steps:["Выносим x за скобку: x(x − 4) = 0.","Произведение равно нулю, когда один множитель равен нулю.","Корни: 0 и 4."]}],
    practice:[{q:"x² − 7x + 10 = 0",a:"Корни 5 и 2 (D = 9)"},{q:"x² + 6x + 9 = 0",a:"x = −3 (D = 0, корень один)"},{q:"x² − 16 = 0",a:"x = 4 и x = −4"}],
    mistakes:["Теряют минус у b: если b = −5, то −b = 5.","Находят один корень, а второй забывают.","Неполные уравнения решают через дискриминант, хотя можно проще."],
    hack:"Если нет c или b, дискриминант не нужен. Выноси x за скобку или переноси число.",
    quiz:[{q:"Корни уравнения x² − 3x + 2 = 0",o:["1 и 2","−1 и −2","1 и −2","3 и 2"],a:0},{q:"Чему равен дискриминант уравнения x² + 2x − 3 = 0?",o:["4","8","16","−8"],a:2},{q:"Решите x² = 25",o:["5","−5","5 и −5","25"],a:2}]},
  {id:"math-pythagoras", emoji:"📏", title:"Теорема Пифагора", short:"Главная формула прямоугольного треугольника",
    explain:"У прямоугольного треугольника есть прямой угол. Две стороны рядом с ним называются катетами. Самая длинная сторона напротив прямого угла называется гипотенузой.",
    rule:`<div class="formula">a² + b² = c²</div><p>a и b это катеты, c это гипотенуза.</p><p>Красивые тройки, которые стоит запомнить: 3-4-5, 5-12-13, 6-8-10, 8-15-17.</p>`,
    examples:[{q:"Катеты 3 и 4. Найти гипотенузу",steps:["c² = 3² + 4² = 9 + 16 = 25.","c = 5."]},{q:"Гипотенуза 13, катет 5. Найти второй катет",steps:["b² = 13² − 5² = 169 − 25 = 144.","b = 12."]},{q:"Катеты 6 и 8",steps:["c² = 36 + 64 = 100.","c = 10."]}],
    practice:[{q:"Катеты 5 и 12. Гипотенуза?",a:"13"},{q:"Гипотенуза 10, катет 6. Второй катет?",a:"8 (100 − 36 = 64)"},{q:"Лестница длиной 2,5 м стоит в 1,5 м от стены. На какой высоте она касается стены?",a:"2 м (6,25 − 2,25 = 4)"}],
    mistakes:["Складывают стороны, а не их квадраты.","Путают гипотенузу с катетом. Гипотенуза всегда самая длинная.","Ищут катет, но складывают вместо вычитания."],
    hack:"Ищем гипотенузу, то квадраты складываем. Ищем катет, то из квадрата гипотенузы вычитаем.",
    quiz:[{q:"Катеты 6 и 8. Чему равна гипотенуза?",o:["10","12","14","100"],a:0},{q:"Гипотенуза 5, катет 3. Второй катет?",o:["2","4","8","34"],a:1},{q:"Катеты 9 и 12. Гипотенуза?",o:["15","21","18","225"],a:0}]},
  {id:"math-area", emoji:"🔷", title:"Площади фигур", short:"Квадрат, треугольник, трапеция и друзья",
    explain:"Площадь показывает, сколько места занимает фигура. Высота это всегда отрезок под прямым углом к основанию, а не просто боковая сторона.",
    rule:`<ul><li>Прямоугольник: S = a · b</li><li>Параллелограмм: S = a · h</li><li>Треугольник: S = ½ · a · h</li><li>Трапеция: S = (a + b) / 2 · h</li></ul>`,
    examples:[{q:"Треугольник: основание 10, высота 6",steps:["S = ½ · 10 · 6.","S = 30."]},{q:"Трапеция: основания 4 и 10, высота 5",steps:["Полусумма оснований: (4 + 10) / 2 = 7.","S = 7 · 5 = 35."]},{q:"Параллелограмм: сторона 7, высота к ней 3",steps:["S = 7 · 3 = 21."]}],
    practice:[{q:"Прямоугольник 8 × 5",a:"40"},{q:"Треугольник: основание 12, высота 5",a:"30"},{q:"Трапеция: основания 6 и 8, высота 4",a:"28"}],
    mistakes:["Забывают ½ у треугольника.","Берут боковую сторону вместо высоты."],
    hack:"Высота образует прямой угол с основанием. Ищи на рисунке значок прямого угла.",
    quiz:[{q:"Треугольник: основание 8, высота 3. Площадь?",o:["24","12","11","6"],a:1},{q:"Трапеция: основания 3 и 7, высота 4. Площадь?",o:["20","40","28","10"],a:0},{q:"Параллелограмм: сторона 9, высота 2. Площадь?",o:["11","18","9","36"],a:1}]},
  {id:"math-prob", emoji:"🎲", title:"Вероятность", short:"Какой шанс, что повезёт",
    explain:"Вероятность показывает, насколько событие возможно. Она всегда от 0 до 1. Ноль означает, что так не бывает, единица означает, что так будет точно.",
    rule:`<div class="formula">P = нужные исходы / все исходы</div><p>В ответе ОГЭ обычно просят десятичную дробь, например 0,4.</p>`,
    examples:[{q:"Кубик. Какова вероятность выпадения 5?",steps:["Всего граней 6, нужная одна.","P = 1/6."]},{q:"В коробке 3 красных и 7 синих шаров. Достаём красный",steps:["Всего шаров: 3 + 7 = 10.","Красных 3, значит P = 3/10 = 0,3."]},{q:"Из 25 пирожков 5 с вишней. Берём наугад",steps:["P = 5/25.","Сократим на 5: 1/5 = 0,2."]}],
    practice:[{q:"Монета. Вероятность выпадения орла?",a:"0,5"},{q:"В классе 25 человек, 10 девочек. Случайно выбирают одного. Вероятность, что это девочка?",a:"0,4 (10/25)"},{q:"Кубик. Вероятность чётного числа?",a:"0,5 (3 чётных из 6)"}],
    mistakes:["Делят нужные исходы на ненужные, а надо на ВСЕ.","Ответ получился больше 1. Так не бывает, ищи ошибку."],
    hack:"Сначала посчитай ВСЕХ, потом нужных. Дробь запиши, и только потом переводи в десятичную.",
    quiz:[{q:"Кубик: выпало число больше 4. Вероятность?",o:["1/6","1/3","1/2","2/3"],a:1},{q:"В пакете 4 яблока и 6 груш. Вероятность достать яблоко?",o:["0,6","0,4","0,5","4"],a:1},{q:"Какой вероятности не бывает?",o:["0,5","1","1,5","0"],a:2}]}
  ]},
{id:"russian", name:"Русский язык", emoji:"📖", blurb:"Правила, запятые, сочинение",
  exam:["Три части: изложение, тест с короткими ответами и сочинение","Максимум 33 балла","Для тройки нужно набрать 15 баллов, и часть из них за грамотность","На экзамен даётся 3 часа 55 минут","Актуальные критерии лучше сверить на fipi.ru"],
  topics:[
  {id:"rus-vowels", emoji:"🌱", title:"Безударные гласные в корне", short:"О или А? Е или И? Проверяем ударением",
    explain:"Безударную гласную мы слышим плохо. Поэтому делаем её ударной: меняем форму слова или подбираем родственное слово. Где слышно ясно, там и пишем.",
    rule:`<p>Проверочное слово должно быть однокоренным.</p><ul><li>вода → воды (О)</li><li>трава → травы (А)</li><li>весна → вёсны (Е)</li></ul><p>Если проверить нельзя, это словарное слово. Его просто запоминаем: корова, молоко, собака.</p>`,
    examples:[{q:"в..да",steps:["Меняем форму: воды.","Под ударением слышно О.","Пишем: вода."]},{q:"з..лёный",steps:["Подбираем родственное слово: зелень.","Под ударением Е.","Пишем: зелёный."]},{q:"с..сна",steps:["Меняем число: сосны.","Под ударением О.","Пишем: сосна."]}],
    practice:[{q:"л..са (много чего в лесу)",a:"леса (лес, пишем Е)"},{q:"п..ля",a:"поля (поле, пишем О)"},{q:"г..ра",a:"гора (горы, пишем О)"}],
    mistakes:["Берут проверочное слово с другим корнем.","Пытаются проверить словарное слово. Оно проверяется только словарём.","Меняют слово так, что гласная всё равно остаётся без ударения."],
    hack:"Не получается проверить? Скорее всего это словарное слово. Открой словарь или запиши его в «копилку».",
    quiz:[{q:"Какая буква пропущена: с..дой (седина)?",o:["е","и","я","а"],a:0},{q:"Какое слово НЕЛЬЗЯ проверить ударением?",o:["вода","молоко","трава","леса"],a:1},{q:"Какая буква пропущена: л..сной (лес)?",o:["е","и","я","а"],a:0}]},
  {id:"rus-nn", emoji:"🧶", title:"Н и НН в прилагательных", short:"Одна или две буквы Н",
    explain:"Количество Н зависит от суффикса. Смотрим, какой суффикс в слове, и вспоминаем правило. Есть три исключения, их надо выучить.",
    rule:`<ul><li>НН в суффиксах -ЕНН-, -ОНН-: утренний, станционный.</li><li>Одна Н в суффиксах -АН-, -ЯН-, -ИН-: кожаный, глиняный, утиный.</li></ul><p>Исключения (пишем НН): СТЕКЛЯННЫЙ, ОЛОВЯННЫЙ, ДЕРЕВЯННЫЙ.</p>`,
    examples:[{q:"кожа → кожа_ый",steps:["Суффикс -АН-.","Одна Н.","Пишем: кожаный."]},{q:"утро → утр_ий",steps:["Суффикс -ЕНН-.","Две Н.","Пишем: утренний."]},{q:"стекло → стекл_ый",steps:["Это исключение.","Пишем две Н: стеклянный."]}],
    practice:[{q:"серебро → серебря_ый",a:"серебряный (одна Н)"},{q:"осень → осен_ий",a:"осенний (две Н)"},{q:"дерево → деревя_ый",a:"деревянный (исключение, две Н)"}],
    mistakes:["Пишут «кожанный», хотя суффикс -АН-.","Забывают исключения про стекло, олово и дерево."],
    hack:"Запомни кусочек: СТЕКЛО, ОЛОВО, ДЕРЕВО это всегда две Н. Остальное по суффиксу.",
    quiz:[{q:"Как пишется: глиня_ый?",o:["Н","НН"],a:0},{q:"Как пишется: стекля_ый?",o:["Н","НН"],a:1},{q:"Как пишется: осен_ий?",o:["Н","НН"],a:1}]},
  {id:"rus-ne", emoji:"🚫", title:"НЕ с разными частями речи", short:"Слитно или раздельно",
    explain:"Частица НЕ пишется то слитно, то раздельно. Помогает простой приём: если можно заменить слово похожим без НЕ, чаще всего пишем слитно.",
    rule:`<ul><li>С глаголами НЕ пишется раздельно: не бегать, не знает.</li><li>Слитно, если слова без НЕ не бывает: неряха, ненавидеть.</li><li>Слитно, если можно заменить синонимом: невысокий = низкий.</li><li>Раздельно при противопоставлении «а»: не высокий, а низкий.</li></ul>`,
    examples:[{q:"Она (не)радуется победе",steps:["Это глагол.","С глаголами НЕ отдельно.","Пишем: не радуется."]},{q:"Вот (не)ряха",steps:["Слова «ряха» в таком смысле нет.","Пишем слитно: неряха."]},{q:"Дом (не)высокий, а низкий",steps:["Есть противопоставление «а».","Пишем раздельно: не высокий."]}],
    practice:[{q:"Он (не)добрый (злой)",a:"недобрый (слитно, заменяется «злой»)"},{q:"Это (не)друг, а враг",a:"не друг (раздельно, есть «а»)"},{q:"Я (не)хочу идти",a:"не хочу (глагол, раздельно)"}],
    mistakes:["Пишут слитно с глаголами.","Не замечают слово «а», которое требует раздельного написания."],
    hack:"Попробуй убрать НЕ. Если слово без НЕ звучит странно, пиши слитно.",
    quiz:[{q:"Он (не)знает ответ",o:["слитно","раздельно"],a:1},{q:"Вот такая (не)ряха!",o:["слитно","раздельно"],a:0},{q:"Задача (не)трудная, а лёгкая",o:["слитно","раздельно"],a:1}]},
  {id:"rus-uniform", emoji:"🍎", title:"Запятые при однородных членах", short:"Перечисления и союзы А, НО",
    explain:"Однородные члены отвечают на один вопрос и относятся к одному слову. Например: «купила яблоки, груши и сливы». Между ними ставим запятые, но не всегда.",
    rule:`<ul><li>Перечисление: запятая между словами, перед одиночным «и» не ставим.</li><li>Перед «а», «но», «зато» запятая нужна всегда.</li><li>Повторяющееся «и…и»: запятая между частями.</li></ul>`,
    examples:[{q:"Я люблю чай кофе и какао",steps:["Это перечисление.","Запятые между первыми словами, перед одиночным «и» нет.","Я люблю чай, кофе и какао."]},{q:"Он умный но ленивый",steps:["Есть противопоставление, союз «но».","Перед «но» запятая.","Он умный, но ленивый."]},{q:"И дождь и ветер мешали идти",steps:["«И…и» повторяется.","Запятая между частями.","И дождь, и ветер мешали идти."]}],

function chatStatus(){

async function chatInit(){

async function chatSend(preset){
  const ta=$("chatin");
  const text=(preset!=null?preset:(ta?ta.value:"")).trim();
  if(!text||chatBusy) return;
  if(!sampleFn){ toast("Помощник работает только по ссылке claude.ai 🌷"); return; }
  chatBusy=true; chatErr=""; chatStream="";
  if(ta) ta.value="";
  chatTurns.push({role:"user",content:text});
  paintChat(); chatStatus();
  try{
    const msgs=[{role:"user",content:CHAT_RULES}].concat(chatTurns.slice(-12));
    const res=await sampleFn(msgs,{cache:false,modelTier:"quick",onText:u=>{
      chatStream=u.text;
      const live=$("chatlive"); if(live){ live.textContent=u.text; const lg=$("chatlog"); if(lg) lg.scrollTop=lg.scrollHeight; }
    }});
    chatTurns.push({role:"assistant",content:res.text}); saveChat();
  }catch(e){
    chatTurns.pop();
    const code=e&&e.code;
    if(code==="not_granted"||code==="sampling_disabled"||code==="not_declared"||code==="capability_disabled"){ sampleFn=null; sampleState="none"; }
    else if(code==="rate_limited") chatErr="Сейчас слишком много сообщений. Подожди минутку и попробуй снова 🌷";
    else if(code!=="cancelled") chatErr="Не получилось ответить. Попробуй ещё раз 🌷";
    if(ta&&!ta.value) ta.value=text;
  }finally{
    chatBusy=false; chatStream="";
    paintChat(); chatStatus();
  }
}

    const k=Number(t.getAttribute("data-opt")); st.picked=k;
    const ok=k===r.t.quiz[st.i].a; if(ok) st.score++;
    if(!r.s.lesson) recordAnswer(r.t.id+"#"+st.i,ok);
    $("quiz").innerHTML=quizHTML(r.t);
    if(ok){ const b=$("quiz").querySelector(".opt.ok"); if(b) confettiAt(b); }
  }
  else if(t.hasAttribute("data-next")){
    const r=findRoute(); if(r.view!=="topic") return;
    const st=quizState[r.t.id]; st.i++; st.picked=null;
    $("quiz").innerHTML=quizHTML(r.t);
    if(st.i>=r.t.quiz.length && st.score===r.t.quiz.length) burst(innerWidth/2,innerHeight/2,20,["🏆","💖","✨","🎉","🌸"]);
  }
  else if(t.hasAttribute("data-retry")){
    const r=findRoute(); if(r.view!=="topic") return;
    quizState[r.t.id]={i:0,score:0,picked:null}; $("quiz").innerHTML=quizHTML(r.t);
  }
  else if(t.hasAttribute("data-ropt")){
    if(!session||session.picked!==null) return;
    const S=session, q=S.qs[S.i], k=Number(t.getAttribute("data-ropt"));
    S.picked=k; const ok=k===q.a;
    if(ok) S.score++; else S.missed.push(q);
    recordAnswer(q.id,ok);
    $("run").innerHTML=runInner();
    if(ok){ const b=$("run").querySelector(".opt.ok"); if(b) confettiAt(b); }
  }
  else if(t.hasAttribute("data-rnext")){
    if(!session) return;
    session.i++; session.picked=null;
    $("run").innerHTML=runInner();
    if(session.i>=session.qs.length && session.score===session.qs.length) burst(innerWidth/2,innerHeight/2,20,["🏆","💖","✨","🎉","🌸"]);
  }
  else if(t.hasAttribute("data-rretry")){
    const r=findRoute(); session=makeSession(r.key); render(false);
  }
  else if(t.hasAttribute("data-flip")){
    if(!cardsS) return; cardsS.flipped=!cardsS.flipped; $("cardbox").innerHTML=cardInner();
  }
  else if(t.hasAttribute("data-know")){
    if(!cardsS) return; cardsS.deck.shift(); cardsS.known++; cardsS.flipped=false;
    $("cardbox").innerHTML=cardInner();
    burst(e.clientX,e.clientY,8);
  }
  else if(t.hasAttribute("data-again")){
    if(!cardsS) return; cardsS.deck.push(cardsS.deck.shift()); cardsS.flipped=false; $("cardbox").innerHTML=cardInner();
  }
  else if(t.hasAttribute("data-cardsreset")){ cardsS=makeCards(); render(false); }
  else if(t.hasAttribute("data-goal")){
    const i=Number(t.getAttribute("data-goal")), g=getGoals();
    g.c[i]=!g.c[i]; LS.set("liza_goals",g); render(false);
    if(g.c[i]) burst(e.clientX,e.clientY,14,["🎉","💖","✨","🌸"]);
  }
  else if(t.hasAttribute("data-chatsend")){ chatSend(); }
  else if(t.hasAttribute("data-chatchip")){ chatSend(t.getAttribute("data-chatchip")); }
  else if(t.hasAttribute("data-star")){
    const rv=reviewState(); rv.stars=Number(t.getAttribute("data-star")); LS.set("liza_review",rv);
    const st=$("stars"); if(st) st.innerHTML=starsHTML(rv.stars);
    updateRvLink(); burst(e.clientX,e.clientY,10,["💖","✨","🌸"]);
  }
  else if(t.hasAttribute("data-rvcopy")){
    copyText(reviewMsg()).then(ok=>{
      if(ok) toast("Скопировано! Теперь можно отправить 💌");
      else { const ta=$("rvtext"); if(ta&&ta.select) ta.select(); toast("Выдели текст и скопируй вручную 🌷"); }
    });
  }
  else if(t.hasAttribute("data-timer")){ timerAction(t.getAttribute("data-timer")); }
  else if(t.hasAttribute("data-msg")){
    msgOpen=!msgOpen;
    $("msgbox").innerHTML = msgOpen?`<p class="msg-text">${MY_MESSAGE}</p>`:"";
    if(msgOpen) burst(e.clientX,e.clientY,16,["💗","💌","💖","✨"]);
  }
});
document.addEventListener("change",e=>{
  if(e.target && e.target.id==="exdate"){
    examDate=e.target.value; LS.set("liza_date",examDate);
    const c=$("cd"); if(c) c.innerHTML=countdownHTML();
  }
});
document.addEventListener("input",e=>{
  if(e.target && e.target.id==="rvtext"){ const rv=reviewState(); rv.text=e.target.value; LS.set("liza_review",rv); updateRvLink(); }
});
document.addEventListener("keydown",e=>{
  if(e.target && e.target.id==="chatin" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); chatSend(); }
});
initHearts();
initStreak();
render();
</script>
</body></html>
